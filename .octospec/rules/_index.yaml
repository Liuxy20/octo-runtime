rules:
- id: runtime-adapter-metadata
  priority: 90
  load_bearing: true
  inject_when:
    paths:
    - packages/octo-runtime-adapter-*/**
    - packages/octo-runtime-executor-core/**
    - config/**
    touches:
    - adapter
    - agent-source
- id: runtime-architecture
  priority: 100
  load_bearing: true
  inject_when:
    paths:
    - apps/**
    - packages/**
    - config/**
    - '*.md'
    - .octospec/**
    touches:
    - architecture
    - runtime
    - adapter
    - context
    - installation
- id: runtime-channel
  priority: 0
  load_bearing: false
  inject_when:
    paths: []
    touches: []
- id: commit
  priority: 70
  load_bearing: false
  inject_when:
    paths:
    - '**'
    touches:
    - commit
    - git
    - documentation
- id: runtime-context-extensions
  priority: 90
  load_bearing: true
  inject_when:
    paths:
    - packages/octo-runtime-protocol/**
    - packages/octo-runtime-executor-kernel/**
    - packages/octo-runtime-executor-core/**
    - test/context-extension*
    touches:
    - context
    - extension
- id: runtime-context-input
  priority: 90
  load_bearing: true
  inject_when:
    paths:
    - packages/octo-runtime-protocol/**
    - packages/octo-runtime-executor-core/**
    - packages/octo-runtime-adapter-*/**
    - test/model-context*
    touches:
    - context
    - model-input
    - workspace
- id: runtime-engineering
  priority: 80
  load_bearing: false
  inject_when:
    paths:
    - apps/**
    - packages/**
    - scripts/**
    - test/**
    - test-support/**
    touches:
    - typescript
    - protocol
    - testing
    - integration
- id: runtime-environment
  priority: 90
  load_bearing: true
  inject_when:
    paths:
    - packages/octo-runtime-protocol/**
    - packages/octo-runtime-adapter-*/**
    - packages/octo-runtime-executor-core/**
    - test/*envs*
    touches:
    - envs
    - context
- id: runtime-extras
  priority: 0
  load_bearing: false
  inject_when:
    paths: []
    touches: []
- id: runtime-invoke-input
  priority: 90
  load_bearing: true
  inject_when:
    paths:
    - apps/cli/**
    - packages/octo-runtime-executor-core/**
    - packages/octo-runtime-protocol/**
    - packages/octo-runtime-executor-kernel/**
    - packages/octo-runtime-host-sdk/**
    touches:
    - invoke
    - protocol
    - multimodal
- id: runtime-local-execution
  priority: 90
  load_bearing: true
  inject_when:
    paths:
    - packages/octo-runtime-host-sdk/**
    - packages/octo-runtime-executor-kernel/**
    - packages/octo-runtime-executor-core/**
    - apps/**
    - test/host-run*
    - test/embedded-invoke*
    touches:
    - ipc
    - invoke
    - stream
- id: runtime-mcp
  priority: 90
  load_bearing: true
  inject_when:
    paths:
    - packages/octo-runtime-protocol/**
    - packages/octo-runtime-adapter-*/**
    - packages/octo-runtime-executor-core/**
    - test/context-mcp*
    touches:
    - mcp
    - context
- id: runtime-openclaw
  priority: 90
  load_bearing: true
  inject_when:
    paths:
    - packages/octo-runtime-adapter-openclaw/**
    - packages/octo-runtime-executor-core/src/invoke-input.ts
    - apps/cli/**
    - test/openclaw-*
    touches:
    - openclaw
    - adapter
    - workspace
- id: runtime-output-protocol
  priority: 90
  load_bearing: true
  inject_when:
    paths:
    - packages/octo-runtime-protocol/**
    - packages/octo-runtime-executor-kernel/**
    - packages/octo-runtime-executor-core/**
    - packages/octo-runtime-host-sdk/**
    - packages/octo-runtime-adapter-sdk/**
    - test/native-*
    - test/host-*
    touches:
    - protocol
    - native
    - canonical
    - stream
- id: runtime-protocol-design
  priority: 95
  load_bearing: true
  inject_when:
    paths:
    - packages/octo-runtime-protocol/**
    - packages/octo-runtime-executor-core/**
    - packages/octo-runtime-executor-kernel/**
    - packages/octo-runtime-adapter-*/**
    - packages/octo-runtime-host-sdk/**
    - apps/**
    touches:
    - protocol
    - invocation
    - interaction
    - adapter
    - architecture
- id: runtime-protocol-schema
  priority: 90
  load_bearing: true
  inject_when:
    paths:
    - packages/octo-runtime-protocol/**
    - test/*protocol*
    - test/context-*
    touches:
    - protocol
    - schema
- id: runtime-reasoning
  priority: 90
  load_bearing: true
  inject_when:
    paths:
    - packages/octo-runtime-adapter-*/**
    - packages/octo-runtime-executor-core/**
    - test/*reasoning*
    touches:
    - reasoning
    - adapter
- id: runtime-lifecycle
  priority: 90
  load_bearing: true
  inject_when:
    paths:
    - packages/octo-runtime-host-sdk/**
    - packages/octo-runtime-executor-kernel/**
    - apps/cli/**
    - test/*runtime*
    - test/embedded-*
    - test/kernel-invoke*
    touches:
    - runtime
    - identity
    - lifecycle
- id: runtime-session-reset
  priority: 90
  load_bearing: true
  inject_when:
    paths:
    - packages/octo-runtime-protocol/**
    - test/*session*
    touches:
    - session
    - reset
- id: runtime-stateless
  priority: 90
  load_bearing: true
  inject_when:
    paths:
    - packages/octo-runtime-executor-core/**
    - packages/octo-runtime-host-sdk/**
    - packages/octo-runtime-executor-kernel/**
    - test/stateless-*
    touches:
    - storage
    - stream
    - stateless

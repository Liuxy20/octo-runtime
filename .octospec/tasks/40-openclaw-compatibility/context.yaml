confirmed_direction:
  - Support 2026.7.1 through current stable releases across session creation, execution, streaming, approvals, cancellation, terminal state, and cleanup.
  - Resolve compatibility inside the OpenClaw adapter from actual handshake protocol, server.version, methods and events, and verified version contracts; protocol v4 alone is insufficient.
  - Share one contract resolver between read-only probe and invocation; revalidate every new connection or reconnection instead of trusting a cached probe decision.
  - Keep the public Runtime calling interface unified; callers do not supply provider version branches.
  - Permissions are business intent, mainly full_access and ask; approximate native mappings and explicit degradation are allowed without requiring legacy versions to reproduce modern guarded filesystem boundaries.
  - User explicitly authorizes broader per-invocation permissions for compatibility; when ask is unavailable, fall back to full_access with a notice and without per-call confirmation. Keep ask when it is available.
  - The approval bridge and required approval transport checks must follow effective full_access after ask falls back, while preserving the original request identity and Context hash. Missing human approval transport alone must not block an available full path.
  - This authorization applies to the OpenClaw adapter compatibility task, not global policy changes or other providers. Explicit refusal alone does not satisfy old-version usability acceptance.
  - The 27 audited tags include 2026.6.11 plus the original 26 releases from 7.1 onward; support for unlisted releases requires continued contract verification.
proposed_details:
  - Exact audited release lookup with shared contract implementations; no unbounded version ranges or floating-point version comparison.
  - Legacy full/off and allowlist/on-miss session patches are first-choice candidates, subject to reviewer and harness verification; unsupported ask falls back to full instead of requiring stricter always handling.
  - Reuse run.notice/provider_diagnostic for explicit degradation; do not add public permission modes or notice fields.
  - Four implementation slices and explicit contract, permission, lifecycle, fault, and cleanup acceptance cases are documented in implementation-plan.md.

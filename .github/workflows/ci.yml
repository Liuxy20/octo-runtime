name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Validated release commit SHA
        type: string
        required: true
      release_version:
        description: Optional stable SemVer stamped into the verified release artifact
        type: string
        required: false
        default: ""
      build_time:
        description: Original UTC artifact build timestamp for release verification and recovery
        type: string
        required: false
        default: ""

env:
  OCTO_RUNTIME_BUILD_TIME: ${{ inputs.build_time || '' }}

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build, test and package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Read the pnpm version from package.json's packageManager field.
      - name: Install Go for native component fixture
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install naming-check prerequisite
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install ripgrep
            else
              sudo apt-get update
              sudo apt-get install --yes ripgrep
            fi
          fi
          rg --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint && pnpm lint:names
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck and build
        run: pnpm typecheck
      - name: Check bilingual developer documentation and examples
        run: pnpm docs:check
      - name: Check generated protocol and lockfile drift
        run: git diff --exit-code -- pnpm-lock.yaml packages/octo-runtime-protocol/src/generated/protocol-types.ts
      - name: Test
        # Run the same suites as pnpm test, reusing the preceding build.
        run: pnpm test:suites
      - name: Pack single distribution
        id: pack
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_VERSION" ]; then
            node scripts/pack-release.mjs --version "$RELEASE_VERSION"
            VERSION="$RELEASE_VERSION"
          else
            node scripts/pack-release.mjs
            VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          fi
          echo "archive=dist/release/mininglamp-oss-octo-runtime-$VERSION.tgz" >> "$GITHUB_OUTPUT"
      - name: Verify offline installation and public API
        shell: bash
        env:
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: |
          set -euo pipefail
          EXPECTED_COMMIT=$(git rev-parse HEAD)
          node scripts/verify-release.mjs "$ARCHIVE" \
            --expected-commit "$EXPECTED_COMMIT" \
            --require-clean
      - name: Upload verified npm archive
        # Keep one canonical release artifact for npm/GitHub Release consumers.
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: octo-runtime-release
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  verify-windows-release:
    name: Verify release package (windows-latest, Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build release package
        run: pnpm build
      - name: Check bilingual developer documentation and examples on Windows
        run: pnpm docs:check
      - name: Verify file security boundaries on Windows
        run: node --unhandled-rejections=strict --test test/security-remediation.test.js test/hourly-log.test.js test/channel-tool-environment.test.js
      - name: Verify release process ownership and failure diagnostics on Windows
        run: node --unhandled-rejections=strict --test test/release-process.test.js test/windows-release-verifier.test.js
      - name: Verify Core, Kernel and independent Extra lifecycle on Windows
        run: node --unhandled-rejections=strict --test test/executor-core.test.js test/executor-cleanup-budget.test.js test/native-cleanup.test.js test/zcode-cleanup.test.js test/kernel-clients.test.js test/kernel-invoke.test.js test/kernel-invoke-lifecycle.test.js test/kernel-invoke-consumers.test.js test/kernel-worker-supervision.test.js test/host-sdk-lifecycle.test.js test/extra-service-shutdown.test.js test/extra-dependency-container.test.js test/native-service-architecture.test.js test/kernel-ipc-contract.test.js test/cli-components.test.js test/extra-startup.test.js test/native-startup.test.js test/service-bind-startup.test.js
      # Native process identity queries have their own deadlines; isolate them from process-heavy suites.
      - name: Verify Windows process identity and startup rollback
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            node --unhandled-rejections=strict --test --test-concurrency=1 test/invocation-manifest.test.js test/component-startup.test.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify Gateway drain and finalization on Windows
        run: node --test test/gateway-host-session-store.test.js test/gateway-shutdown-drain.test.js test/gateway-runner-drain.test.js test/im-extra-disposal.test.js test/im-task-retry.test.js test/im-protocol.test.js test/im-context-gap-wire.test.js
      - name: Verify recovery and Extra status logs on Windows
        run: >-
          node --unhandled-rejections=strict --test
          test/extra-status-logs.test.js
          test/kernel-heartbeat.test.js
          test/kernel-worker-recovery.test.js
          test/im-connection-state-machine.test.js
          test/recovery-dual-mode.test.js
      - name: Verify Windows worker log drain and close budget
        run: node --unhandled-rejections=strict --test test/host-process-close.test.js
      - name: Verify Host logging on Windows
        run: node --test --test-name-pattern="F31 Host logging|F31 unavailable" test/runtime-debug.test.js
      - name: Pack single distribution
        id: pack
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_VERSION" ]; then
            node scripts/pack-release.mjs --version "$RELEASE_VERSION"
            VERSION="$RELEASE_VERSION"
          else
            node scripts/pack-release.mjs
            VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          fi
          echo "archive=dist/release/mininglamp-oss-octo-runtime-$VERSION.tgz" >> "$GITHUB_OUTPUT"
      - name: Verify Windows installation and independent component cleanup
        shell: bash
        env:
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: |
          set -euo pipefail
          EXPECTED_COMMIT=$(git rev-parse HEAD)
          node scripts/verify-windows-release.mjs "$ARCHIVE" "$EXPECTED_COMMIT"

  gate:
    # Stable required-check name: matrix failures and skipped builds must fail it.
    # See .octospec/tasks/company-development-checks/brief.md.
    name: CI Gate
    needs: [check, verify-windows-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every matrix job to succeed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          WINDOWS_RELEASE_RESULT: ${{ needs.verify-windows-release.result }}
        run: |
          if [ "$CHECK_RESULT" != "success" ] || [ "$WINDOWS_RELEASE_RESULT" != "success" ]; then
            echo "::error::CI did not succeed: matrix=$CHECK_RESULT windows-release=$WINDOWS_RELEASE_RESULT"
            exit 1
          fi
